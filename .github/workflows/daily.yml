name: Aurora Daily Brief

on:
  schedule:
    # Deux éditions par jour, à partir de 6h30 et 18h30 à Paris toute l'année.
    # GitHub ne connaît que l'UTC (créneaux d'été UTC+2 et d'hiver UTC+1) et
    # lance souvent ses crons avec plusieurs heures de retard : le job « gate »
    # laisse générer le premier cron qui part après l'horaire, s'il n'y a pas
    # encore d'édition pour ce créneau, et ignore les autres.
    # L'app iOS cale ses rechargements sur ces heures
    # (BriefingStore.generationTimes) : les modifier ensemble.
    - cron: '30 4 * * *'   # 6h30 Paris en été
    - cron: '30 5 * * *'   # 6h30 Paris en hiver
    - cron: '30 16 * * *'  # 18h30 Paris en été
    - cron: '30 17 * * *'  # 18h30 Paris en hiver
  workflow_dispatch: # Permet de lancer manuellement

permissions:
  contents: write  # nécessaire pour pousser docs/summaries.json

concurrency:
  group: aurora-daily
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs
      - id: check
        env:
          EVENT: ${{ github.event_name }}
        shell: python
        run: |
          # Lancement manuel : toujours. Cron : seulement si l'édition publiée
          # est antérieure au dernier horaire (6h30 ou 18h30 à Paris) passé.
          import json, os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Europe/Paris"))
          slots = [
              now.replace(hour=hour, minute=minute, second=0, microsecond=0) - timedelta(days=days)
              for days in (0, 1)
              for hour, minute in ((6, 30), (18, 30))
          ]
          slot = max(s for s in slots if s <= now)
          with open("docs/summaries.json", encoding="utf-8") as f:
              stamp = json.load(f)["generated_at"].replace("Z", "+00:00")
          published = datetime.fromisoformat(stamp)
          run = os.environ["EVENT"] != "schedule" or published < slot
          print(f"Créneau {slot:%d/%m %Hh%M}, dernière édition {published.astimezone(now.tzinfo):%d/%m %Hh%M} : {'génération' if run else 'déjà publiée'}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"run={'true' if run else 'false'}\n")

  generate:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Generate summaries
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}  # optionnel, modèle à essayer en premier
        run: python backend/main.py

      - name: Commit and push
        run: |
          git config user.name "Aurora Bot"
          git config user.email "bot@aurora.app"
          git add docs/summaries.json
          git diff --staged --quiet && exit 0
          git commit -m "📰 Édition du $(TZ=Europe/Paris date +'%d/%m/%Y %Hh%M')"
          git pull --rebase
          git push
