name: Aurora Daily Brief

on:
  schedule:
    # Deux éditions par jour. L'app iOS cale ses rechargements sur ces heures
    # (BriefingStore.editionHoursUTC) : les modifier ensemble.
    - cron: '0 6 * * *'   # Matin : 6h UTC (8h Paris en été, 7h en hiver)
    - cron: '0 17 * * *'  # Soir : 17h UTC (19h Paris en été, 18h en hiver)
  workflow_dispatch: # Permet de lancer manuellement
    inputs:
      demo_angles:
        description: "Démo : comparer le traitement entre médias, écrit dans docs/demo.json"
        type: boolean
        default: false

permissions:
  contents: write  # nécessaire pour pousser docs/summaries.json

concurrency:
  group: aurora-daily
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Generate summaries
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}  # optionnel, modèle à essayer en premier
          DEMO_ANGLES: ${{ inputs.demo_angles }}
        run: |
          if [ "$DEMO_ANGLES" = "true" ]; then
            python backend/main.py --angles --output docs/demo.json
          else
            python backend/main.py
          fi

      - name: Commit and push
        env:
          DEMO_ANGLES: ${{ inputs.demo_angles }}
        run: |
          git config user.name "Aurora Bot"
          git config user.email "bot@aurora.app"
          git add docs/*.json
          git diff --staged --quiet && exit 0
          if [ "$DEMO_ANGLES" = "true" ]; then MSG="🧪 Démo angles"; else MSG="📰 Édition"; fi
          git commit -m "$MSG du $(TZ=Europe/Paris date +'%d/%m/%Y')"
          git pull --rebase
          git push
