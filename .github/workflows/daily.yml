name: Aurora Daily Brief

on:
  schedule:
    # Deux éditions par jour, prêtes pour 7h et 19h à Paris toute l'année.
    # GitHub ne connaît que l'UTC : chaque édition a un créneau d'été (UTC+2)
    # et un créneau d'hiver (UTC+1), et le job « gate » ne garde que le bon.
    # La génération démarre à 6h30 / 18h30 pour absorber les retards du cron.
    # L'app iOS cale ses rechargements sur ces heures
    # (BriefingStore.generationTimes) : les modifier ensemble.
    - cron: '30 4 * * *'   # 6h30 Paris en été
    - cron: '30 5 * * *'   # 6h30 Paris en hiver
    - cron: '30 16 * * *'  # 18h30 Paris en été
    - cron: '30 17 * * *'  # 18h30 Paris en hiver
  workflow_dispatch: # Permet de lancer manuellement

permissions:
  contents: write  # nécessaire pour pousser docs/summaries.json

concurrency:
  group: aurora-daily
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # Lancement manuel : toujours. Cron : seulement le créneau qui
          # correspond au décalage horaire actuel de Paris.
          if [ "$EVENT" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$SCHEDULE" in
            "30 4 * * *"|"30 16 * * *") WANT="+0200" ;;
            *) WANT="+0100" ;;
          esac
          OFFSET=$(TZ=Europe/Paris date +%z)
          echo "Créneau $SCHEDULE, Paris en $OFFSET, attendu $WANT"
          if [ "$OFFSET" = "$WANT" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  generate:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Generate summaries
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}  # optionnel, modèle à essayer en premier
        run: python backend/main.py

      - name: Commit and push
        run: |
          git config user.name "Aurora Bot"
          git config user.email "bot@aurora.app"
          git add docs/summaries.json
          git diff --staged --quiet && exit 0
          git commit -m "📰 Édition du $(TZ=Europe/Paris date +'%d/%m/%Y %Hh%M')"
          git pull --rebase
          git push
